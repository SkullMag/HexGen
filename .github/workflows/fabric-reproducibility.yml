name: FABRIC reproducibility

on:
  pull_request:
    paths:
      - deploy/fabric/reproducibility/**
      - .github/workflows/fabric-reproducibility.yml
  push:
    branches: [main]
    paths:
      - deploy/fabric/reproducibility/**
      - .github/workflows/fabric-reproducibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLCONFIGDIR: /tmp/hexgen-mpl-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: deploy/fabric/reproducibility/requirements.txt
      - run: python -m pip install -r deploy/fabric/reproducibility/requirements.txt
      - run: python -m unittest discover -s deploy/fabric/reproducibility -p 'test_*.py' -v
      - name: Validate plan without authentication or allocations
        run: python -O deploy/fabric/reproducibility/provision.py provision --plan deploy/fabric/reproducibility/five-node-plan.json --name offline --out /tmp/unused --dry-run
      - name: Validate telemetry template without contacting FABRIC
        run: python deploy/fabric/reproducibility/telemetry.py --config deploy/fabric/reproducibility/telemetry-plan.json --out /tmp/unused --duration 60 --dry-run
      - name: Rebuild all six measured latency ECDFs
        run: python deploy/fabric/reproducibility/plot_ecdf.py deploy/fabric/reproducibility/results/2026-10-13
