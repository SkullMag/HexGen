name: Build NRP HexGen image

on:
  push:
    branches: [experiment/nrp-k8s-demo]
    paths:
      - .github/workflows/nrp-image.yml
      - .dockerignore
      - deploy/nrp/**
      - benchmark/**
      - hexgen/**
      - third_party/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nrp-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - dockerfile: deploy/nrp/Dockerfile
            tag_prefix: nrp
          - dockerfile: deploy/nrp/Dockerfile.hopper
            tag_prefix: nrp-hopper
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/skullmag/hexgen:${{ matrix.tag_prefix }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
