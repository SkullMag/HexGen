apiVersion: batch/v1
kind: Job
metadata:
  name: hexgen-nrp-13b-hetero-client
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: client
        image: ghcr.io/skullmag/hexgen@sha256:c2a8a83d7ca6c5bce16514942a206e4e871dfafc0aa373f9942bd56b22b21391
        imagePullPolicy: IfNotPresent
        args:
        - client
        envFrom:
        - secretRef:
            name: hexgen-nrp-s3
        env:
        - name: VARIANT
          value: decentralized-13b-a10-rtx5000
        - name: RUN_ID
          value: example
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: MODEL_NAME
          value: HexGen-Llama2-13B-NRP
        - name: HEAD_NODE
          value: http://hexgen-nrp-13b-hetero-head:8092
        - name: WARMUPS
          value: '3'
        - name: REQUESTS
          value: '100'
        - name: PROMPTS_FILE
          value: /model/workload/prompt_bank.json
        - name: RATES
          value: 0.125 0.25 0.5 1 2 4
        - name: NEW_TOKENS
          value: '32'
        - name: ARRIVAL_SEED
          value: '20260919'
        - name: REQUEST_TIMEOUT_S
          value: '1800'
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '1'
            memory: 2Gi
        volumeMounts:
        - name: model
          mountPath: /model
          readOnly: true
      priorityClassName: opportunistic
      nodeSelector:
        kubernetes.io/hostname: usra-sti-01.uah.edu
        topology.kubernetes.io/region: us-east
      volumes:
      - name: model
        persistentVolumeClaim:
          claimName: hexgen-model-west-13b
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
