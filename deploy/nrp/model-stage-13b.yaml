apiVersion: batch/v1
kind: Job
metadata:
  name: hexgen-nrp-stage-llama13b
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      nodeSelector:
        topology.kubernetes.io/region: us-west
      containers:
      - name: stage
        image: ghcr.io/skullmag/hexgen@sha256:c2a8a83d7ca6c5bce16514942a206e4e871dfafc0aa373f9942bd56b22b21391
        imagePullPolicy: IfNotPresent
        command: [/bin/bash, -ec]
        args:
        - |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download, snapshot_download

          repo = 'meta-llama/Llama-2-13b-hf'
          revision = os.environ['MODEL_REVISION']
          checkpoint = Path('/model/checkpoint')
          workload = Path('/model/workload')
          checkpoint.mkdir(parents=True, exist_ok=True)
          workload.mkdir(parents=True, exist_ok=True)
          marker = checkpoint / 'snapshot_revision.json'
          if marker.exists() and json.loads(marker.read_text())['revision'] != revision:
              raise RuntimeError('Model volume contains another checkpoint revision')
          snapshot_download(
              repo_id=repo, revision=revision, local_dir=str(checkpoint),
              allow_patterns=['config.json', 'generation_config.json', 'tokenizer.model',
                              'tokenizer_config.json', 'special_tokens_map.json',
                              'model.safetensors.index.json', 'model-*.safetensors'],
              max_workers=4, token=True)
          index = json.loads((checkpoint / 'model.safetensors.index.json').read_text())
          shards = sorted(set(index['weight_map'].values()))
          if len(shards) != 3 or any(not (checkpoint / name).is_file() or
                                     (checkpoint / name).stat().st_size == 0 for name in shards):
              raise RuntimeError('The pinned 13B safetensors shards are incomplete')
          marker.write_text(json.dumps({'repo_id': repo, 'revision': revision,
                                        'shards': len(shards)}) + '\n')
          dataset = Path(hf_hub_download(
              repo_id='lmsys/chatbot_arena_conversations', repo_type='dataset',
              revision='1b6335d42a1d2c7e34870c905d03ab964f7f2bd8',
              filename='data/train-00000-of-00001-cced8514c7ed782a.parquet',
              local_dir=str(workload), token=True))
          observed = hashlib.sha256(dataset.read_bytes()).hexdigest()
          if observed != '3726a6352e9bfc34e206460646f6e5e99bb837751966a671ddd30c7f64e5b06e':
              raise RuntimeError('Pinned prompt dataset SHA-256 mismatch')
          print('Pinned 13B checkpoint and prompt dataset ready', flush=True)
          PY
          if [ ! -s /model/workload/prompt_bank.json ]; then
            python -m pip install --no-cache-dir --quiet pyarrow==18.1.0
            python /tmp/hexgen-13b-scripts/prepare_prompt_bank.py \
              --dataset-file /model/workload/data/train-00000-of-00001-cced8514c7ed782a.parquet \
              --dataset-sha256 3726a6352e9bfc34e206460646f6e5e99bb837751966a671ddd30c7f64e5b06e \
              --tokenizer-path /model/checkpoint \
              --model-repo meta-llama/Llama-2-13b-hf \
              --model-revision "$MODEL_REVISION" \
              --output /model/workload/prompt_bank.json
          fi
          python /tmp/hexgen-13b-scripts/stream_convert_llama.py \
            --checkpoint /model/checkpoint --output /model/converted \
            --revision "$MODEL_REVISION"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          bank = json.loads(Path('/model/workload/prompt_bank.json').read_text())
          if bank['model_revision'] != os.environ['MODEL_REVISION'] or len(bank['prompts']) != 500:
              raise RuntimeError('13B prompt bank revision or count mismatch')
          converted = json.loads(Path('/model/converted/conversion_complete.json').read_text())
          if converted['revision'] != os.environ['MODEL_REVISION'] or converted['layers'] != 40:
              raise RuntimeError('13B layer conversion is incomplete')
          print('Remote Llama-2-13B inputs ready', flush=True)
          PY
        envFrom:
        - secretRef:
            name: hexgen-hf-token
        env:
        - name: MODEL_REVISION
          value: 5c31dfb671ce7cfe2d7bb7c04375e44c55e815b1
        - name: HF_HUB_OFFLINE
          value: '0'
        - name: TRANSFORMERS_OFFLINE
          value: '0'
        - name: HF_HOME
          value: /tmp/hf
        - name: PYTHONPATH
          value: /tmp/hexgen-13b-scripts
        - name: HF_HUB_DOWNLOAD_TIMEOUT
          value: '300'
        resources:
          requests:
            cpu: '4'
            memory: 28Gi
          limits:
            cpu: '4'
            memory: 32Gi
        volumeMounts:
        - name: model
          mountPath: /model
        - name: scripts
          mountPath: /tmp/hexgen-13b-scripts
          readOnly: true
      volumes:
      - name: model
        persistentVolumeClaim:
          claimName: hexgen-model-west-13b
      - name: scripts
        configMap:
          name: hexgen-nrp-13b-scripts
