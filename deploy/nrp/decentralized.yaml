apiVersion: v1
kind: Service
metadata:
  name: hexgen-nrp-hetero-head
spec:
  selector:
    app: hexgen-nrp-hetero-head
  ports:
  - name: http
    port: 8092
    targetPort: 8092
  - name: nats
    port: 8094
    targetPort: 8094
  - name: torch
    port: 29511
    targetPort: 29511
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hexgen-nrp-hetero-head
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: hexgen-nrp-hetero-head
    spec:
      terminationGracePeriodSeconds: 90
      nodeSelector:
        kubernetes.io/hostname: hcc-prp-c5038.unl.edu
        topology.kubernetes.io/region: us-central
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: PreferNoSchedule
      volumes:
      - name: model
        persistentVolumeClaim:
          claimName: hexgen-model-unl
      - name: results
        emptyDir: {}
      - name: ocf-config
        configMap:
          name: hexgen-nrp-ocf
      containers:
      - name: coordinator
        image: ghcr.io/skullmag/hexgen:nrp-k8s-demo
        imagePullPolicy: Always
        args:
        - ocf
        ports:
        - containerPort: 8092
        - containerPort: 8094
        volumeMounts:
        - name: ocf-config
          mountPath: /etc/hexgen
          readOnly: true
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '1'
            memory: 2Gi
      - name: worker
        image: ghcr.io/skullmag/hexgen:nrp-k8s-demo
        imagePullPolicy: Always
        args:
        - worker
        envFrom:
        - secretRef:
            name: hexgen-nrp-s3
        env:
        - name: VARIANT
          value: decentralized
        - name: RUN_ID
          value: example
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: LOCAL_GPU_COUNT
          value: '3'
        - name: RANK_OFFSET
          value: '0'
        - name: WORLD_SIZE
          value: '5'
        - name: HETERO_CONFIG
          value: 2 1 2
        - name: PP_PARTITION
          value: 40 20 20
        - name: MODEL_SIZE
          value: llama-70b
        - name: MODEL_LAYERS
          value: '80'
        - name: MODEL_NAME
          value: HexGen-Llama2-70B-NRP
        - name: CHECKPOINT_PATH
          value: /model/checkpoint
        - name: STATE_DICTS_PATH
          value: /model/converted
        - name: HEAD_NODE
          value: http://hexgen-nrp-hetero-head:8092
        - name: OCF_WORKER_ADDR
          value: hexgen-nrp-hetero-head
        - name: MASTER_ADDR
          value: hexgen-nrp-hetero-head
        - name: MASTER_PORT
          value: '29511'
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: GLOO_SOCKET_IFNAME
          value: eth0
        volumeMounts:
        - name: model
          mountPath: /model
          readOnly: true
        - name: results
          mountPath: /results
        resources:
          requests:
            cpu: '12'
            memory: 144Gi
            nvidia.com/rtxa6000: '3'
          limits:
            cpu: '14'
            memory: 172Gi
            nvidia.com/rtxa6000: '3'
      restartPolicy: Never
      priorityClassName: opportunistic
---
