# Short placement gate for the two-replica 13B comparison. Delete promptly.
# Each Job expires after two minutes even if a client disconnects.
apiVersion: batch/v1
kind: Job
metadata:
  name: hexgen-probe-fleet-a10-pair-1
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      nodeSelector:
        topology.kubernetes.io/region: us-east
        nvidia.com/gpu.product: NVIDIA-A10
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: PreferNoSchedule
      containers:
      - name: probe
        image: busybox:1.36
        command: [sh, -c, 'sleep 120']
        resources:
          requests: {cpu: '3', memory: 42Gi, nvidia.com/gpu: '2'}
          limits: {cpu: '3', memory: 42Gi, nvidia.com/gpu: '2'}
---
