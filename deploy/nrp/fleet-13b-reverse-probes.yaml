# Alternate 13B gate: one East A10 pair and two West RTX 3090 pairs.
# Delete promptly; each Job expires after two minutes.
apiVersion: batch/v1
kind: Job
metadata:
  name: hexgen-probe-reverse-a10-east
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        topology.kubernetes.io/region: us-east
        nvidia.com/gpu.product: NVIDIA-A10
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: PreferNoSchedule
      containers:
      - name: probe
        image: busybox:1.36
        command: [sh, -c, 'sleep 120']
        resources:
          requests: {cpu: '3', memory: 42Gi, nvidia.com/gpu: '2'}
          limits: {cpu: '3', memory: 42Gi, nvidia.com/gpu: '2'}
---
