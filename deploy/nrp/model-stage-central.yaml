apiVersion: batch/v1
kind: Job
metadata:
  name: hexgen-nrp-stage-central
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: hcc-prp-c5038.unl.edu
        topology.kubernetes.io/region: us-central
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: PreferNoSchedule
      containers:
      - name: stage
        image: ghcr.io/skullmag/hexgen:nrp-k8s-demo
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -ec
        args:
        - |
          python /opt/hexgen/deploy/nrp/stage_model.py --revision "$MODEL_REVISION"
          if [ ! -s /model/workload/prompt_bank.json ]; then
            python /opt/hexgen/deploy/nrp/prepare_prompt_bank.py \
              --dataset-file /model/workload/data/train-00000-of-00001-cced8514c7ed782a.parquet \
              --dataset-sha256 3726a6352e9bfc34e206460646f6e5e99bb837751966a671ddd30c7f64e5b06e \
              --tokenizer-path /model/checkpoint \
              --model-revision "$MODEL_REVISION" \
              --output /model/workload/prompt_bank.json
          fi
          python /opt/hexgen/deploy/nrp/stream_convert_llama.py \
            --checkpoint /model/checkpoint --output /model/converted \
            --revision "$MODEL_REVISION"
          python - <<'PY'
          import json, os
          from pathlib import Path
          bank = json.loads(Path('/model/workload/prompt_bank.json').read_text())
          if bank['model_revision'] != os.environ['MODEL_REVISION'] or len(bank['prompts']) != 500:
              raise SystemExit('Prompt bank revision or count mismatch')
          if not Path('/model/converted/conversion_complete.json').is_file():
              raise SystemExit('Conversion marker missing')
          print('Remote 70B checkpoint, prompt bank, and conversion ready', flush=True)
          PY
        envFrom:
        - secretRef:
            name: hexgen-hf-token
        env:
        - name: MODEL_REVISION
          value: 3aba440b59558f995867ba6e1f58f21d0336b5bb
        - name: HF_HUB_OFFLINE
          value: '0'
        - name: TRANSFORMERS_OFFLINE
          value: '0'
        - name: HF_HOME
          value: /tmp/hf
        - name: HF_HUB_DOWNLOAD_TIMEOUT
          value: '300'
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
          limits:
            cpu: '4'
            memory: 36Gi
        volumeMounts:
        - name: model
          mountPath: /model
      volumes:
      - name: model
        persistentVolumeClaim:
          claimName: hexgen-model-unl
